services:
  - type: web
    name: eduplateforme
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eduplateforme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: https://eduplateforme-yrgs.onrender.com
      - key: TRUST_PROXY
        value: "true"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: DOMAIN_PROVIDER_MODE
        value: disabled
      - key: DOMAIN_PROVIDER_LOW_BALANCE_THRESHOLD
        value: "100"

databases:
  - name: eduplateforme-db
    plan: free
    databaseName: eduplateforme
    user: eduplateforme
